name = "newgreen-cms"
main = "src/index.ts"
compatibility_date = "2025-03-01"

# Cloudflare D1 database binding.
# For local dev this works as-is. Before deploying, the client creates the
# database ( wrangler d1 create newgreen-db ) and pastes the returned id below.
[[d1_databases]]
binding = "DB"
database_name = "newgreen-db"
database_id = "96b562af-fca6-4897-9bfa-dc217c53482a"
migrations_dir = "migrations"

# Daily housekeeping: prune stale rate-limit rows + orphaned media (see cleanup()).
[triggers]
crons = ["0 4 * * *"]

# ADMIN_SECRET is set as a Worker secret in production:
#   wrangler secret put ADMIN_SECRET
# Locally it is read from a .dev.vars file (see .dev.vars.example).
#
# TURNSTILE_SECRET (optional) enables server-side CAPTCHA verification:
#   wrangler secret put TURNSTILE_SECRET
# If unset, the honeypot + per-IP rate limit still protect the public forms.
